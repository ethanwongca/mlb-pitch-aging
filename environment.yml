name: mlb-pitch-aging
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - tqdm
  - pyarrow
  - xarray
  - arviz<1
  - pymc
  - bambi
  - ipykernel
  - pip
  - pip:
      - pybaseball
      - PyGithub
      - beautifulsoup4
      # GPU sampling: jax[cuda12_pip] bundles its own CUDA runtime — no nvcc needed,
      # only the NVIDIA driver (nvidia-smi). Use cuda11_pip if driver reports CUDA < 12.
      - "jax[cuda12_pip]"
      - numpyro
